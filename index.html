 <div class="hud-top"><div class="hud-chip" id="hud-count">⭐ <strong>0 / 10</strong></div><button class="hud-skip" id="hud-skip" type="button">Ver invitación ↗</button></div>

<script>
// ======================================================
// CONFIGURACIÓN DE LA INVITACIÓN
//
// Esto es lo importante de este cambio: el juego YA NO TIENE los datos
// de la invitación escritos adentro. Los busca según el "id" que viene
// en el link (por ejemplo, ?id=cumple-juan). Hoy esa búsqueda es en una
// lista de ejemplos acá abajo; el día que conectemos la base de datos
// real (Supabase), lo único que cambia es DE DÓNDE viene ese dato — el
// resto del motor del juego no se toca.
// ======================================================
const CATALOGO_DEMO = {
  demo: {
    nombres: "Vicki & Juan",
    tipoEvento: "Casamiento",
    fecha: "14 de marzo de 2027",
    hora: "19:30 hs",
    lugar: "Salón Jacarandá",
    direccion: "Av. Libertador 1234, CABA",
    objeto: "frutilla",
    fechaHoraIso: "2027-03-14T19:30:00",
    dressCode: "Elegante sport",
    regaloTexto: "Si querés hacernos un regalo, preferimos una ayuda para la luna de miel:",
    regaloDatos: "Alias: vickiyjuan.boda",
    incluyeJuego: true,
  },
  "cumple-juan": {
    nombres: "Juan",
    tipoEvento: "Cumpleaños",
    fecha: "20 de noviembre de 2026",
    hora: "21:00 hs",
    lugar: "Bar El Rincón",
    direccion: "Av. Corrientes 2200, CABA",
    objeto: "estrella",
    fechaHoraIso: "2026-11-20T21:00:00",
    dressCode: "Casual",
    regaloTexto: "No hace falta, pero si querés hacerme un regalo:",
    regaloDatos: "Alias: juan.cumple33",
    incluyeJuego: true,
  },
  "solo-tarjeta": {
    nombres: "Marina",
    tipoEvento: "Cumpleaños",
    fecha: "5 de diciembre de 2026",
    hora: "20:00 hs",
    lugar: "Casa de Marina",
    direccion: "Av. Scalabrini Ortiz 800, CABA",
    objeto: "corazon",
    fechaHoraIso: "2026-12-05T20:00:00",
    dressCode: "Como vengas",
    regaloTexto: "Con tu presencia alcanza, pero si querés sumarte a un regalo grupal:",
    regaloDatos: "Alias: marina.cumple30",
    incluyeJuego: false,
  },
};

function obtenerIdDeLaUrl() {
  const params = new URLSearchParams(window.location.search);
  return params.get('id') || 'demo';
}

// La fila de la tabla "invitaciones" en Supabase usa nombres de columna
// con guión bajo (tipo_evento); el resto del código usa camelCase
// (tipoEvento). Esta función hace esa traducción en un solo lugar.
function normalizarInvitacion(fila) {
  return {
    nombres: fila.nombres,
    tipoEvento: fila.tipo_evento,
    fecha: fila.fecha,
    hora: fila.hora,
    lugar: fila.lugar,
    direccion: fila.direccion,
    objeto: fila.objeto,
    fechaHoraIso: fila.fecha_hora_iso || null,
    dressCode: fila.dress_code || null,
    regaloTexto: fila.regalo_texto || null,
    regaloDatos: fila.regalo_datos || null,
    incluyeJuego: fila.incluye_juego !== false,
  };
}

async function cargarInvitacion(id) {
  // 1) Buscarla en la base de datos real (Supabase) — esta es la fuente
  //    de verdad: acá es donde van a vivir las invitaciones de verdad.
  try {
    const { data, error } = await clienteDB
      .from('invitaciones')
      .select('*')
      .eq('id', id)
      .maybeSingle();
    if (data) {
      const invitacion = normalizarInvitacion(data);
      // La guardamos también en el celu, por si el día de mañana se corta
      // la conexión justo cuando alguien recarga la página a mitad de partida.
      localStorage.setItem('invitacion_' + id, JSON.stringify(invitacion));
      return invitacion;
    }
  } catch (error) {
    console.error('No se pudo consultar Supabase, probamos con lo guardado en el celu:', error);
  }
  // 2) Si no se pudo traer de la base (sin internet, Supabase caído, etc.),
  //    ¿la teníamos guardada de una visita anterior en este mismo celu?
  const guardada = localStorage.getItem('invitacion_' + id);
  if (guardada) return JSON.parse(guardada);
  // 3) Catálogo de ejemplo embebido en el código, como último respaldo,
  //    para que la demo nunca se rompa aunque falle todo lo demás.
  if (CATALOGO_DEMO[id]) return CATALOGO_DEMO[id];
  return CATALOGO_DEMO.demo;
}

// Estas variables arrancan vacías y se completan recién cuando termina de
// cargar la invitación (ver "iniciar()" más abajo, al final del archivo).
// Los métodos de las escenas del juego las usan, pero no se ejecutan hasta
// después de que el juego arranca — para entonces, ya están completas.
let ID_INVITACION, INVITACION, EMOJI_OBJETO, COLOR_OBJETO, SIMBOLO_FINAL;

// El objeto a juntar y el símbolo final cambian según la invitación, sin
// tocar el motor: están armados sobre un catálogo chico reutilizable.
const EMOJI_OBJETOS = { frutilla: '🍓', estrella: '⭐', corazon: '❤️', mate: '🧉' };
const COLOR_OBJETOS = { frutilla: 0xffd93d, estrella: 0xffd93d, corazon: 0xff6b6b, mate: 0x8fbc5a };

const EMOJI_FINAL = { 'Casamiento': '💍', 'Cumpleaños': '🎂', 'Quince años': '👑' };

// ======================================================
// CONEXIÓN A LA BASE DE DATOS (Supabase)
//
// La "SUPABASE_KEY" de acá abajo es una clave pública (publishable),
// pensada para usarse en el navegador de cualquiera que abra la
// invitación. No es una contraseña ni da acceso administrativo: la
// tabla "respuestas_rsvp" tiene reglas (RLS) que solo permiten insertar
// y leer respuestas, nada más.
// ======================================================
const SUPABASE_URL = 'https://ruxaofwsoihkcytepjiw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_9NxRoWpnD3RCjF0BuPWfwQ_t-Bx6Zyq';
const clienteDB = window.supabase ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;


// ======================================================
// MÚSICA DE FONDO
//
// En vez de usar un archivo de música grabado (que traería problemas de
// derechos de autor si no es nuestro), generamos un sonido 8-bit/chiptune
// con código, estilo "jueguito retro". Es 100% original: no hay ningún
// riesgo de copyright, y no hace falta subir ni alojar ningún archivo de
// audio en ningún lado.
//
// Los navegadores no dejan arrancar sonido sin que la persona toque algo
// primero, así que esto se crea recién cuando el invitado elige "con
// sonido" en la pantalla inicial (ver "pedirPreferenciaSonido" más abajo).
// ======================================================
let SONIDO_ACTIVADO = false;
let musicaJuego = null;

function crearMusicaJuego() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const salida = ctx.createGain();
  salida.gain.value = 0.12; // volumen bajo, de fondo
  salida.connect(ctx.destination);

  const NOTA = { DO: 261.63, RE: 293.66, MI: 329.63, FA: 349.23, SOL: 392.00, LA: 440.00, SI: 493.88, DO2: 523.25 };
  // Melodía cortita y alegre que se repite en loop.
  const MELODIA = [
    [NOTA.DO, 0.15], [NOTA.MI, 0.15], [NOTA.SOL, 0.15], [NOTA.DO2, 0.15],
    [NOTA.SOL, 0.15], [NOTA.MI, 0.15], [NOTA.DO, 0.3],
    [NOTA.RE, 0.15], [NOTA.FA, 0.15], [NOTA.LA, 0.15], [NOTA.FA, 0.15],
    [NOTA.RE, 0.3], [0, 0.15],
  ];

  let activo = false;
  let temporizador = null;

  function tocarNota(frecuencia, duracion) {
    if (!frecuencia) return; // 0 = silencio (un "pulso" sin sonido, para el ritmo)
    const osc = ctx.createOscillator();
    const volumenNota = ctx.createGain();
    osc.type = 'square'; // onda cuadrada = sonido "8 bits"
    osc.frequency.value = frecuencia;
    volumenNota.gain.setValueAtTime(0.9, ctx.currentTime);
    volumenNota.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duracion);
    osc.connect(volumenNota);
    volumenNota.connect(salida);
    osc.start();
    osc.stop(ctx.currentTime + duracion);
  }

  function loop(i) {
    if (!activo) return;
    const [frecuencia, duracion] = MELODIA[i % MELODIA.length];
    tocarNota(frecuencia, duracion * 0.9);
    temporizador = setTimeout(() => loop(i + 1), duracion * 1000);
  }

  return {
    iniciar() {
      if (activo) return;
      activo = true;
      if (ctx.state === 'suspended') ctx.resume();
      loop(0);
    },
    detener() {
      activo = false;
      clearTimeout(temporizador);
    },
  };
}


function claveRSVP(id) { return 'rsvp_' + id; }

function obtenerRSVPGuardado(id) {
  const guardado = localStorage.getItem(claveRSVP(id));
  return guardado ? JSON.parse(guardado) : null;
}

async function guardarRSVP(id,datos){
  // El invitado nunca ve un falso envío confirmado si la red falló.
  const key=claveRSVP(id);
  localStorage.setItem(key,JSON.stringify({...datos,pendiente:true}));
  try{
    if(!clienteDB)throw new Error('Supabase no disponible');
    const {error}=await clienteDB.from('respuestas_rsvp').insert({
      invitacion_id:id,nombre:datos.nombre,asiste:datos.asiste,
      cantidad:datos.cantidad,mensaje:datos.mensaje
    });
    if(error)throw error;
    localStorage.setItem(key,JSON.stringify({...datos,pendiente:false}));
    return {ok:true};
  }catch(error){
    console.warn('RSVP guardado localmente, falta sincronizar:',error);
    return {ok:false};
  }
}


let intervaloCuentaRegresiva = null;

function linkMaps(direccion) {
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(direccion || '');
}

function linkCalendario(invitacion) {
  if (!invitacion.fechaHoraIso) return null;
  const inicio = new Date(invitacion.fechaHoraIso);
  if (isNaN(inicio.getTime())) return null;
  const DURACION_HORAS_DEFAULT = 3; // si no sabemos cuánto dura el evento, asumimos 3hs
  const fin = new Date(inicio.getTime() + DURACION_HORAS_DEFAULT * 60 * 60 * 1000);
  const comoUTC = (d) => d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: invitacion.nombres + ' — ' + invitacion.tipoEvento,
    dates: comoUTC(inicio) + '/' + comoUTC(fin),
    location: invitacion.direccion || invitacion.lugar || '',
    details: 'Invitación: ' + window.location.href,
  });
  return 'https://www.google.com/calendar/render?' + params.toString();
}

function formatearCuentaRegresiva(fechaHoraIso) {
  const objetivo = new Date(fechaHoraIso).getTime();
  if (isNaN(objetivo)) return null;
  const diferencia = objetivo - Date.now();
  if (diferencia <= 0) return '¡Ya llegó el día! 🎉';
  const dias = Math.floor(diferencia / 86400000);
  const horas = Math.floor((diferencia % 86400000) / 3600000);
  const minutos = Math.floor((diferencia % 3600000) / 60000);
  const segundos = Math.floor((diferencia % 60000) / 1000);
  return dias + 'd ' + horas + 'h ' + minutos + 'm ' + segundos + 's';
}

function actualizarCuentaRegresiva() {
  const el = document.getElementById('cuenta-regresiva');
  if (!el) return;
  el.textContent = '⏳ ' + formatearCuentaRegresiva(INVITACION.fechaHoraIso);
}

async function generarQRDataURL(texto) {
  try {
    return await QRCode.toDataURL(texto, { width: 240, margin: 1, color: { dark: '#1a1a2e', light: '#ffffff' } });
  } catch (error) {
    console.error('No se pudo generar el código QR:', error);
    return null;
  }
}

  if (scene.textures.exists(key)) scene.textures.remove(key);
  const texture = scene.textures.createCanvas(key, Math.ceil(width), Math.ceil(height));

      const alto=i%4===0?this.playerHeight*1.12:this.playerHeight*.58;
      const sprite=this.add.image(0,this.suelo-alto,'tesoro').setDepth(5).setScale(this.W<500?.78:.85);
      const tomado=x<this.distancia-40;
      if(tomado)sprite.setVisible(false);
      this.objetos.push({x,alto,sprite,tomado});
    }
    this.salto=()=>this.saltar();
    $('jump-btn').onclick=this.salto;
    $('hud-skip').onclick=()=>this.abrirInvitacion();
    this.input.on('pointerdown',(pointer)=>{if(pointer.downElement?.tagName==='CANVAS')this.saltar();});
    if(this.input.keyboard){this.input.keyboard.on('keydown-SPACE',this.salto);this.input.keyboard.on('keydown-UP',this.salto);}
    this.onResize=()=>this.scene.restart({distance:this.distancia,contador:this.contador});
    this.scale.on('resize',this.onResize);
    this.events.once('shutdown',()=>{this.scale.off('resize',this.onResize);$('jump-btn').onclick=null;$('hud-skip').onclick=null;if(this.input.keyboard){this.input.keyboard.off('keydown-SPACE',this.salto);this.input.keyboard.off('keydown-UP',this.salto);}});
    $('hud-count').innerHTML=`${escaparHTML(EMOJI_OBJETO)} <strong>${Math.min(this.contador,10)} / ${OBJETOS_PARA_GANAR}</strong>`;
    if(SONIDO_ACTIVADO&&musicaJuego)musicaJuego.iniciar();
  }
  saltar(){
    if(this.terminado||this.alturaSalto>1)return;
    this.velSalto=-Math.max(625,this.playerHeight*4.75);
    this.alturaSalto=2;
    $('jump-btn').classList.add('pressed');setTimeout(()=>$('jump-btn').classList.remove('pressed'),130);
    soltarPolvo(this,this.personaX-28,this.suelo,5);
  }
  tomar(obj){
    obj.tomado=true;
    this.contador++;
    this.tweens.add({targets:obj.sprite,alpha:0,scale:1.5,y:obj.sprite.y-48,duration:240,ease:'Sine.Out',onComplete:()=>obj.sprite.setVisible(false)});
    $('hud-count').innerHTML=`${escaparHTML(EMOJI_OBJETO)} <strong>${Math.min(this.contador,10)} / ${OBJETOS_PARA_GANAR}</strong>`;
    for(let i=0;i<5;i++){
      const spark=this.add.circle(this.personaX+8,this.suelo-this.playerHeight*.65-this.alturaSalto,2.5,0xffefb0).setDepth(9);
      const a=i*Math.PI*2/5;
      this.tweens.add({targets:spark,x:spark.x+Math.cos(a)*33,y:spark.y+Math.sin(a)*33,alpha:0,duration:350,onComplete:()=>spark.destroy()});
    }
  }
  tropezar(obstaculo){
    obstaculo.toco=true;this.hitCooldown=.8;
    this.avatar.setTint(0xf6a0a0);this.time.delayedCall(220,()=>this.avatar?.clearTint());
    this.cameras.main.shake(140,.0024);soltarPolvo(this,this.personaX+25,this.suelo,6);
  }
  abrirInvitacion(){
    if(this.terminado)return;this.terminado=true;
    if(musicaJuego)musicaJuego.detener();
    $('game-hud').style.display='none';
    this.scene.start('EscenaInvitacion');
  }
  update(_time,delta){
    if(this.terminado)return;
    const dt=Math.min(delta/1000,.045);
    this.distancia+=VELOCIDAD_SCROLL*dt;
    // salto y aterrizaje
    if(this.alturaSalto>0||this.velSalto!==0){
      this.velSalto+=1850*dt;this.alturaSalto-=this.velSalto*dt;
      if(this.alturaSalto<=0){this.alturaSalto=0;this.velSalto=0;soltarPolvo(this,this.personaX-18,this.suelo,3);}
    }
    this.avatar.y=this.suelo-this.alturaSalto+(this.alturaSalto===0?Math.sin(this.distancia*.075)*2.7:0);
    this.avatar.angle=this.alturaSalto?Phaser.Math.Clamp(this.velSalto/120,-7,7):Math.sin(this.distancia*.07)*1.6;
    this.sombra.scaleX=1+Math.min(this.alturaSalto/400,.5);this.sombra.alpha=Math.max(.08,.25-this.alturaSalto/900);
    const sprites=[this.capa.mesas,this.capa.far,this.capa.near];
    sprites.forEach(l=>l.tilePositionX=this.distancia*l.getData('parallax'));
    this.capa.floor.tilePositionX=this.distancia*.97;
    const absX=this.personaX;
    this.objetos.forEach((obj,i)=>{
      if(obj.tomado)return;
      const visibleX=absX+obj.x-this.distancia;
      obj.sprite.x=visibleX;
      obj.sprite.y=this.suelo-obj.alto+Math.sin(this.distancia*.012+i)*7;
      obj.sprite.visible=visibleX>-80&&visibleX<this.W+90;
      const centroPersonaje=this.suelo-this.alturaSalto-this.playerHeight*.52;
      if(Math.abs(visibleX-absX)<48&&Math.abs(centroPersonaje-obj.sprite.y)<this.playerHeight*.31+20)this.tomar(obj);
    });
    this.obstaculos.forEach(ob=>{
      const x=absX+ob.x-this.distancia;
      ob.sprite.x=x;ob.sprite.visible=x>-130&&x<this.W+140;
      if(!ob.toco&&this.hitCooldown<=0&&Math.abs(x-absX)<38&&this.alturaSalto<ob.height*.64)this.tropezar(ob);
    });
    if(this.hitCooldown>0)this.hitCooldown-=dt;
    if(this.alturaSalto===0&&this.distancia-this.lastDust>72){this.lastDust=this.distancia;soltarPolvo(this,this.personaX-17,this.suelo,2);}
    $('progress-fill').style.width=Math.min(100,(this.distancia/DISTANCIA_NIVEL)*100)+'%';
    if(this.distancia>=DISTANCIA_NIVEL)this.abrirInvitacion();
  }
}

   nueva presentación estética y adaptada a celular/computadora.

function renderFormularioRSVP(){
  const cont=$('rsvp-form-estado');const previo=obtenerRSVPGuardado(ID_INVITACION);
  if(previo){
    cont.innerHTML=`<div class="rsvp-saved"><strong>${previo.asiste?'✅ ¡Confirmaste tu asistencia!':'💌 Recibimos tu respuesta'}</strong><p>${escaparHTML(previo.nombre)}${previo.asiste?' · '+escaparHTML(previo.cantidad)+' persona(s)':''}</p>${previo.mensaje?'<p>“'+escaparHTML(previo.mensaje)+'”</p>':''}${previo.pendiente?'<p style="color:#a55335;font-size:13px">Tu respuesta quedó guardada en este dispositivo, pero falta enviarla. Revisá tu conexión.</p><button id="rsvp-reintentar" class="secondary-btn" type="button">Reintentar envío</button>':''}<button id="rsvp-editar" class="secondary-btn" type="button">Editar respuesta</button></div>`;
    $('rsvp-editar').onclick=mostrarFormulario;
    if($('rsvp-reintentar'))$('rsvp-reintentar').onclick=async()=>{await guardarRSVP(ID_INVITACION,previo);renderFormularioRSVP();};
  } else mostrarFormulario();
  function mostrarFormulario(){
    cont.innerHTML=`<label class="rsvp-label" for="rsvp-nombre">TU NOMBRE</label><input class="rsvp-input" id="rsvp-nombre" placeholder="¿Cómo te llamás?" autocomplete="name" maxlength="100">
    <div class="rsvp-options"><button class="rsvp-opt" data-asiste="si" type="button">🎉 ¡Sí, voy!</button><button class="rsvp-opt" data-asiste="no" type="button">💌 No puedo</button></div>
    <div id="rsvp-cantidad-cont" style="display:none"><label class="rsvp-label" for="rsvp-cantidad">¿CUÁNTAS PERSONAS VAN?</label><input id="rsvp-cantidad" class="rsvp-input" type="number" min="1" max="10" value="1"></div>
    <label class="rsvp-label" for="rsvp-mensaje">DEJÁ UN MENSAJE (OPCIONAL)</label><textarea id="rsvp-mensaje" class="rsvp-input" rows="2" maxlength="700" placeholder="Escribí algo lindo..."></textarea>
    <button class="submit-btn" id="rsvp-enviar" type="button" disabled>Confirmar asistencia</button><p id="rsvp-error" style="color:#ac4635;font-size:13px"></p>`;
    let asistencia=null;const input=$('rsvp-nombre'),enviar=$('rsvp-enviar');
    const actualizado=()=>enviar.disabled=!(input.value.trim()&&asistencia!==null);
    [...cont.querySelectorAll('.rsvp-opt')].forEach(btn=>btn.onclick=()=>{
      asistencia=btn.dataset.asiste==='si';cont.querySelectorAll('.rsvp-opt').forEach(b=>b.classList.remove('active'));btn.classList.add('active');$('rsvp-cantidad-cont').style.display=asistencia?'block':'none';actualizado();
    });
    input.oninput=actualizado;
    enviar.onclick=async()=>{
      const nombre=input.value.trim();if(!nombre||asistencia===null)return;
      enviar.disabled=true;enviar.textContent='Enviando...';
      const cantidad=asistencia?Phaser.Math.Clamp(parseInt($('rsvp-cantidad').value,10)||1,1,10):0;
      const datos={nombre,asiste:asistencia,cantidad,mensaje:$('rsvp-mensaje').value.trim(),fecha:new Date().toISOString()};
      try{await guardarRSVP(ID_INVITACION,datos);renderFormularioRSVP();}
      catch(error){$('rsvp-error').textContent='No se pudo guardar. Probá nuevamente.';enviar.disabled=false;enviar.textContent='Volver a intentar';}
    };
  }
}
function construirTarjetaInvitacion(){
  $('invite-names').textContent=INVITACION.nombres;
  $('invite-kind').textContent=INVITACION.tipoEvento;
  $('invite-details').innerHTML=`
    <div class="detail-item"><p class="detail-label">📅 FECHA</p><div class="detail-value">${escaparHTML(INVITACION.fecha)}</div></div>
    <div class="detail-item"><p class="detail-label">🕒 HORA</p><div class="detail-value">${escaparHTML(INVITACION.hora)}</div></div>
    <div class="detail-item wide"><p class="detail-label">📍 LUGAR</p><div class="detail-value">${escaparHTML(INVITACION.lugar)}</div><p class="detail-sub">${escaparHTML(INVITACION.direccion)}</p></div>`;
  const url=location.origin+location.pathname+'?id='+encodeURIComponent(ID_INVITACION);
  const map=linkMaps(INVITACION.direccion),calendar=linkCalendario(INVITACION);
  let html='';
  if(INVITACION.fechaHoraIso)html+='<div id="cuenta-regresiva"></div>';
  html+=`<div class="invite-actions"><a href="${map}" target="_blank" rel="noopener noreferrer">📍 Cómo llegar</a>${calendar?`<a href="${calendar}" target="_blank" rel="noopener noreferrer">📅 Agendar</a>`:''}<a href="https://wa.me/?text=${encodeURIComponent('¡Te invito a mi evento! Mirá la invitación: '+url)}" target="_blank" rel="noopener noreferrer">↗ Compartir</a></div>`;
  if(INVITACION.dressCode)html+=`<p style="font-size:14px;color:#815b45"><strong>👗 Código de vestimenta:</strong> ${escaparHTML(INVITACION.dressCode)}</p>`;
  if(INVITACION.regaloTexto||INVITACION.regaloDatos){
    html+='<div class="gift-card">';
    if(INVITACION.regaloTexto)html+=`<div>🎁 ${escaparHTML(INVITACION.regaloTexto)}</div>`;
    if(INVITACION.regaloDatos)html+=`<div class="gift-line"><code>${escaparHTML(INVITACION.regaloDatos)}</code><button id="regalo-copiar" type="button" class="secondary-btn">Copiar</button></div>`;
    html+='</div>';
  }
  html+=`<div class="qr-section">CÓDIGO QR DE ESTA INVITACIÓN<div id="qr-contenedor"></div><a id="qr-descargar" download="invitacion-${escaparHTML(ID_INVITACION)}.png" style="display:none">Descargar mi QR ↓</a></div>`;
  $('info-extra').innerHTML=html;
  if($('regalo-copiar'))$('regalo-copiar').onclick=async()=>{
    try{await navigator.clipboard.writeText(INVITACION.regaloDatos);$('regalo-copiar').textContent='¡Copiado!';}
    catch(e){$('regalo-copiar').textContent='Seleccioná y copiá el alias';}
  };
  if(INVITACION.fechaHoraIso){
    const actualizar=()=>{const el=$('cuenta-regresiva');if(el)el.textContent='⏳ '+formatearCuentaRegresiva(INVITACION.fechaHoraIso);};
    actualizar();if(intervaloCuentaRegresiva)clearInterval(intervaloCuentaRegresiva);intervaloCuentaRegresiva=setInterval(actualizar,1000);
  }
  // El QR es un extra: si falla la librería o no hay Internet, la tarjeta funciona igual.
  if(typeof QRCode!=='undefined')generarQRDataURL(url).then(data=>{
    if(!data||!$('qr-contenedor'))return;
    const img=document.createElement('img');img.src=data;img.alt='QR de la invitación';img.width=160;img.height=160;$('qr-contenedor').replaceChildren(img);
    const link=$('qr-descargar');if(link){link.href=data;link.style.display='inline';}
  });
}
class EscenaInvitacion extends Phaser.Scene{
  constructor(){super('EscenaInvitacion');}
  create(){
    $('game-hud').style.display='none';
    $('invitation-view').style.display='block';
    $('invitation-view').scrollTop=0;
    construirTarjetaInvitacion();renderFormularioRSVP();
    $('volver-jugar').style.display=INVITACION.incluyeJuego?'block':'none';
    $('volver-jugar').onclick=()=>{
      if(intervaloCuentaRegresiva){clearInterval(intervaloCuentaRegresiva);intervaloCuentaRegresiva=null;}
      $('invitation-view').style.display='none';this.scene.start('EscenaJuego');
    };
  }
}
async function iniciar(){
  $('game-container').innerHTML='<div style="height:100%;display:grid;place-items:center;font:700 20px Fredoka,sans-serif;color:#754a35">Preparando tu aventura... ✦</div>';
  ID_INVITACION=obtenerIdDeLaUrl();
  try{INVITACION=await cargarInvitacion(ID_INVITACION);}
  catch(e){console.warn('Se utilizarán datos de demostración:',e);INVITACION=CATALOGO_DEMO[ID_INVITACION]||CATALOGO_DEMO.demo;}
  EMOJI_OBJETO=EMOJI_OBJETOS[INVITACION.objeto]||'⭐';
  COLOR_OBJETO=COLOR_OBJETOS[INVITACION.objeto]||0xffd93d;
  SIMBOLO_FINAL=EMOJI_FINAL[INVITACION.tipoEvento]||'🎉';
  const comenzar=INVITACION.incluyeJuego?await animarInicio():false;
  $('game-container').innerHTML='';
  if(typeof Phaser==='undefined'){
    $('game-container').innerHTML='<div style="padding:36px;margin:50px auto;max-width:500px;border-radius:20px;background:#fff8e8;text-align:center;font-size:16px">No se pudo cargar el motor del juego. Conectate a Internet y recargá esta página.</div>';return;
  }
  instanciaJuego=new Phaser.Game({
    type:Phaser.AUTO,width:window.innerWidth,height:window.innerHeight,
    backgroundColor:'#f5c28c',parent:'game-container',
    scale:{mode:Phaser.Scale.RESIZE,autoCenter:Phaser.Scale.CENTER_BOTH},
    render:{antialias:true,pixelArt:false},
    scene:INVITACION.incluyeJuego?(comenzar?[EscenaJuego,EscenaInvitacion]:[EscenaInvitacion,EscenaJuego]):[EscenaInvitacion]
  });
}
window.addEventListener('DOMContentLoaded',iniciar);

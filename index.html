<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Invitación Juego - Prototipo</title>
<style>
  html, body { margin:0; padding:0; background:#1a1a2e; overflow:hidden; height:100%; }
  #game-container {
    position:fixed; top:0; left:0;
    width:100vw;
    height:100vh;
    height:100dvh; /* en celus modernos, ocupa toda la pantalla de verdad */
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
<div id="game-container"></div>

<!-- El RSVP se hace con elementos HTML normales (no dibujados en el
     juego), porque escribir texto a mano anda mucho mejor así: el
     teclado del celu funciona de forma nativa y es accesible. Esta capa
     solo se muestra arriba de la pantalla de la invitación. -->
<div id="volver-jugar" style="display:none; position:fixed; top:10px; right:10px; z-index:11; font-size:13px; color:#cccccc; font-family:sans-serif; cursor:pointer;">↺ Jugar de nuevo</div>
<div id="rsvp-card" style="display:none; position:fixed; left:0; right:0; bottom:0; max-height:55vh; overflow-y:auto; background:#15132a; border-top:2px solid #ffd93d; padding:16px; padding-bottom:max(16px, env(safe-area-inset-bottom)); box-sizing:border-box; font-family:sans-serif; color:#fff; z-index:10;">
  <div id="rsvp-form-estado"></div>
</div>

<script>
// ======================================================
// CONFIGURACIÓN DE LA INVITACIÓN
//
// Esto es lo importante de este cambio: el juego YA NO TIENE los datos
// de la invitación escritos adentro. Los busca según el "id" que viene
// en el link (por ejemplo, ?id=cumple-juan). Hoy esa búsqueda es en una
// lista de ejemplos acá abajo; el día que conectemos la base de datos
// real (Supabase), lo único que cambia es DE DÓNDE viene ese dato — el
// resto del motor del juego no se toca.
// ======================================================
const CATALOGO_DEMO = {
  demo: {
    nombres: "Vicki & Juan",
    tipoEvento: "Casamiento",
    fecha: "14 de marzo de 2027",
    hora: "19:30 hs",
    lugar: "Salón Jacarandá",
    direccion: "Av. Libertador 1234, CABA",
    objeto: "frutilla",
  },
  "cumple-juan": {
    nombres: "Juan",
    tipoEvento: "Cumpleaños",
    fecha: "20 de noviembre de 2026",
    hora: "21:00 hs",
    lugar: "Bar El Rincón",
    direccion: "Av. Corrientes 2200, CABA",
    objeto: "estrella",
  },
};

function obtenerIdDeLaUrl() {
  const params = new URLSearchParams(window.location.search);
  return params.get('id') || 'demo';
}

function cargarInvitacion(id) {
  // 1) ¿Está en la lista de ejemplos? (mañana, esto sería "¿está en la base de datos?")
  if (CATALOGO_DEMO[id]) {
    // La guardamos también en el celu, por si el día de mañana se corta la
    // conexión justo cuando alguien recarga la página a mitad de partida.
    localStorage.setItem('invitacion_' + id, JSON.stringify(CATALOGO_DEMO[id]));
    return CATALOGO_DEMO[id];
  }
  // 2) Si no, ¿la teníamos guardada de una visita anterior?
  const guardada = localStorage.getItem('invitacion_' + id);
  if (guardada) return JSON.parse(guardada);
  // 3) Si no hay nada de nada, mostramos la de ejemplo para no romper la demo.
  return CATALOGO_DEMO.demo;
}

const ID_INVITACION = obtenerIdDeLaUrl();
const INVITACION = cargarInvitacion(ID_INVITACION);

// El objeto a juntar y el símbolo final cambian según la invitación, sin
// tocar el motor: están armados sobre un catálogo chico reutilizable.
const EMOJI_OBJETOS = { frutilla: '🍓', estrella: '⭐', corazon: '❤️', mate: '🧉' };
const COLOR_OBJETOS = { frutilla: 0xffd93d, estrella: 0xffd93d, corazon: 0xff6b6b, mate: 0x8fbc5a };
const EMOJI_OBJETO = EMOJI_OBJETOS[INVITACION.objeto] || '🍓';
const COLOR_OBJETO = COLOR_OBJETOS[INVITACION.objeto] || 0xffd93d;

const EMOJI_FINAL = { 'Casamiento': '💍', 'Cumpleaños': '🎂', 'Quince años': '👑' };
const SIMBOLO_FINAL = EMOJI_FINAL[INVITACION.tipoEvento] || '🎉';

// ======================================================
// CONEXIÓN A LA BASE DE DATOS (Supabase)
//
// La "SUPABASE_KEY" de acá abajo es una clave pública (publishable),
// pensada para usarse en el navegador de cualquiera que abra la
// invitación. No es una contraseña ni da acceso administrativo: la
// tabla "respuestas_rsvp" tiene reglas (RLS) que solo permiten insertar
// y leer respuestas, nada más.
// ======================================================
const SUPABASE_URL = 'https://ruxaofwsoihkcytepjiw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_9NxRoWpnD3RCjF0BuPWfwQ_t-Bx6Zyq';
const clienteDB = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ======================================================
// RSVP (confirmación de asistencia)
//
// La respuesta se guarda en dos lugares a la vez:
// 1) En el celu de quien responde (localStorage), para que si vuelve a
//    entrar al mismo link, vea su propia respuesta y pueda editarla.
// 2) En Supabase (la base de datos), para que vos puedas ver TODAS las
//    respuestas juntas desde el panel de Supabase, sin depender del
//    celu de cada invitado.
// ======================================================
function claveRSVP(id) { return 'rsvp_' + id; }

function obtenerRSVPGuardado(id) {
  const guardado = localStorage.getItem(claveRSVP(id));
  return guardado ? JSON.parse(guardado) : null;
}

async function guardarRSVP(id, datos) {
  // Guardamos primero en el celu: esto nunca falla y es lo que le
  // permite al invitado ver/editar su respuesta aunque no haya señal.
  localStorage.setItem(claveRSVP(id), JSON.stringify(datos));

  // Después intentamos mandarla a la base de datos central. Si falla
  // (por ejemplo, sin internet), no rompemos la experiencia del
  // invitado: el envío va a quedar pendiente para la próxima vez que
  // use el formulario, y mientras tanto ya ve su respuesta guardada.
  try {
    await clienteDB.from('respuestas_rsvp').insert({
      invitacion_id: id,
      nombre: datos.nombre,
      asiste: datos.asiste,
      cantidad: datos.cantidad,
      mensaje: datos.mensaje,
    });
  } catch (error) {
    console.error('No se pudo guardar la respuesta en Supabase:', error);
  }
}

function renderFormularioRSVP() {
  const cont = document.getElementById('rsvp-form-estado');
  const previo = obtenerRSVPGuardado(ID_INVITACION);

  if (previo) {
    cont.innerHTML = `
      <p style="margin:0 0 8px;font-size:15px;">
        ${previo.asiste ? '✅ Confirmaste tu asistencia' : '📋 Avisaste que no podés ir'}${previo.asiste ? ' — ' + previo.cantidad + (previo.cantidad === 1 ? ' persona' : ' personas') : ''}
      </p>
      <p style="margin:0 0 12px;font-size:13px;color:#cccccc;">${previo.nombre}${previo.mensaje ? ' · "' + previo.mensaje + '"' : ''}</p>
      <button id="rsvp-editar" style="background:none;border:1px solid #666;color:#ccc;padding:8px 14px;border-radius:8px;font-size:13px;">Editar mi respuesta</button>
    `;
    document.getElementById('rsvp-editar').onclick = mostrarFormulario;
    return;
  }
  mostrarFormulario();

  function mostrarFormulario() {
    cont.innerHTML = `
      <p style="margin:0 0 10px;font-weight:bold;">¿Vas a venir?</p>
      <input id="rsvp-nombre" placeholder="Tu nombre" style="width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:none;margin-bottom:8px;font-size:15px;font-family:sans-serif;">
      <div style="display:flex;gap:8px;margin-bottom:8px;">
        <button data-asiste="si" class="rsvp-opcion" style="flex:1;padding:10px;border-radius:8px;border:2px solid #51cf66;background:none;color:#fff;font-size:14px;">Sí, voy</button>
        <button data-asiste="no" class="rsvp-opcion" style="flex:1;padding:10px;border-radius:8px;border:2px solid #ff6b6b;background:none;color:#fff;font-size:14px;">No puedo</button>
      </div>
      <div id="rsvp-cantidad-cont" style="display:none;margin-bottom:8px;">
        <label style="font-size:13px;color:#ccc;">¿Cuántos van (contándote)?</label>
        <input id="rsvp-cantidad" type="number" min="1" max="10" value="1" style="width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:none;margin-top:4px;font-size:15px;">
      </div>
      <textarea id="rsvp-mensaje" placeholder="Mensaje (opcional)" rows="2" style="width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:none;margin-bottom:10px;font-size:14px;font-family:sans-serif;"></textarea>
      <button id="rsvp-enviar" disabled style="width:100%;padding:12px;border-radius:8px;border:none;background:#666;color:#fff;font-size:15px;font-weight:bold;">Confirmar</button>
      <p id="rsvp-error" style="color:#ff8787;font-size:13px;margin:6px 0 0;"></p>
    `;

    let asisteElegido = null;
    const botones = cont.querySelectorAll('.rsvp-opcion');
    const nombreInput = document.getElementById('rsvp-nombre');
    const btnEnviar = document.getElementById('rsvp-enviar');

    function actualizarBotonEnviar() {
      const ok = nombreInput.value.trim().length > 0 && asisteElegido !== null;
      btnEnviar.disabled = !ok;
      btnEnviar.style.background = ok ? '#ffd93d' : '#666';
      btnEnviar.style.color = ok ? '#1a1a2e' : '#fff';
    }

    botones.forEach(b => b.onclick = () => {
      asisteElegido = b.dataset.asiste === 'si';
      botones.forEach(x => x.style.opacity = '0.4');
      b.style.opacity = '1';
      document.getElementById('rsvp-cantidad-cont').style.display = asisteElegido ? 'block' : 'none';
      actualizarBotonEnviar();
    });
    nombreInput.oninput = actualizarBotonEnviar;

    btnEnviar.onclick = async () => {
      const nombre = nombreInput.value.trim();
      if (!nombre || asisteElegido === null) {
        document.getElementById('rsvp-error').textContent = 'Completá tu nombre y si vas a venir.';
        return;
      }
      const cantidadInput = parseInt(document.getElementById('rsvp-cantidad').value, 10) || 1;
      const cantidad = asisteElegido ? Math.max(1, Math.min(10, cantidadInput)) : 0;
      const mensaje = document.getElementById('rsvp-mensaje').value.trim();
      btnEnviar.disabled = true;
      btnEnviar.textContent = 'Enviando...';
      await guardarRSVP(ID_INVITACION, { nombre, asiste: asisteElegido, cantidad, mensaje, fecha: new Date().toISOString() });
      renderFormularioRSVP();
    };
  }
}

function mostrarUIInvitacion() {
  document.getElementById('rsvp-card').style.display = 'block';
  document.getElementById('volver-jugar').style.display = 'block';
  renderFormularioRSVP();
}

function ocultarUIInvitacion() {
  document.getElementById('rsvp-card').style.display = 'none';
  document.getElementById('volver-jugar').style.display = 'none';
}

const VELOCIDAD_SCROLL = 220;          // píxeles por segundo
const OBJETOS_PARA_GANAR = 10;         // con juntar esta cantidad, se termina el nivel
const OBJETOS_TOTALES = 15;            // hay más de los necesarios: si te perdés alguno, quedan otros para seguir juntando
const ESPACIADO_MIN = 260;             // distancia mínima entre frutillas
const ESPACIADO_MAX = 340;             // distancia máxima entre frutillas

// ======================================================
// ESCENA 1: EL JUEGO
// ======================================================
class EscenaJuego extends Phaser.Scene {
  constructor() { super('EscenaJuego'); }

  create() {
    this.gano = false;
    this.tropezando = false;

    // El tamaño real de la pantalla del dispositivo (celu o compu),
    // así el juego ocupa toda la pantalla y no un recuadro chiquito.
    const ANCHO = this.scale.width;
    const ALTO = this.scale.height;
    this.ANCHO = ANCHO;

    // Reservamos una franja abajo solo para los controles, separada del
    // área donde pasan los obstáculos y las frutillas (para que el botón
    // de saltar no quede "pisando" el juego, como pasaba antes).
    const CONTROL_ALTO = 110;
    const ALTO_JUEGO = ALTO - CONTROL_ALTO;

    // --- Personaje (por ahora, un rectángulo simple con un ojo) ---
    this.personaje = this.add.container(120, ALTO_JUEGO - 100);
    this.cuerpo = this.add.rectangle(0, 0, 40, 56, 0xff6b6b, 1).setStrokeStyle(2, 0x1a1a2e);
    const ojo = this.add.circle(10, -10, 4, 0x1a1a2e);
    this.personaje.add([this.cuerpo, ojo]);
    this.physics.add.existing(this.personaje);
    this.personaje.body.setSize(40, 56);
    this.personaje.body.setCollideWorldBounds(false);

    // --- Objetos coleccionables (frutillas de prueba) ---
    // Generamos más frutillas de las que hacen falta (15, cuando solo se
    // necesitan 10): si se pierde alguna, el recorrido sigue dando más
    // oportunidades, en vez de terminar antes de juntar las 10.
    this.objetos = this.physics.add.staticGroup();
    this.contador = 0;
    let x = 400;
    for (let i = 0; i < OBJETOS_TOTALES; i++) {
      const y = ALTO_JUEGO - Phaser.Math.Between(90, 160);
      const objeto = this.add.circle(x, y, 12, COLOR_OBJETO).setStrokeStyle(2, 0xc9a200);
      this.physics.add.existing(objeto, true);
      this.objetos.add(objeto);
      x += Phaser.Math.Between(ESPACIADO_MIN, ESPACIADO_MAX);
    }
    this.physics.add.overlap(this.personaje, this.objetos, this.recolectar, null, this);
    const DISTANCIA_NIVEL = x + 800; // bastante pista de sobra después de la última frutilla
    this.distanciaNivel = DISTANCIA_NIVEL;

    // --- Piso (ya con el largo del nivel calculado) ---
    this.piso = this.add.rectangle(0, ALTO_JUEGO - 40, DISTANCIA_NIVEL + ANCHO * 2, 20, 0x4a3f6b).setOrigin(0, 0);
    this.physics.add.existing(this.piso, true); // true = estático
    this.physics.add.collider(this.personaje, this.piso);

    // --- Obstáculos: NO terminan la partida, solo hacen tropezar ---
    this.obstaculos = this.physics.add.staticGroup();
    for (let ox = 600; ox < DISTANCIA_NIVEL - 250; ox += Phaser.Math.Between(300, 420)) {
      const obstaculo = this.add.rectangle(ox, ALTO_JUEGO - 64, 30, 48, 0x6c5ce7).setStrokeStyle(2, 0x1a1a2e);
      this.physics.add.existing(obstaculo, true);
      this.obstaculos.add(obstaculo);
    }
    this.physics.add.overlap(this.personaje, this.obstaculos, this.tropezar, null, this);

    // --- Meta visual al final del todo: es una red de seguridad, no el
    //     disparador principal (ese es juntar las 10 frutillas) ---
    this.meta = this.add.rectangle(DISTANCIA_NIVEL, ALTO_JUEGO - 120, 50, 160, 0x51cf66, 0.3).setStrokeStyle(3, 0x2f9e44);
    this.add.text(DISTANCIA_NIVEL, ALTO_JUEGO - 220, SIMBOLO_FINAL, { fontSize: '48px' }).setOrigin(0.5);
    this.physics.add.existing(this.meta, true);
    this.physics.add.overlap(this.personaje, this.meta, this.llegarAMeta, null, this);

    // --- Cámara que sigue al personaje ---
    this.cameras.main.setBounds(0, 0, DISTANCIA_NIVEL + ANCHO, ALTO);
    this.physics.world.setBounds(0, 0, DISTANCIA_NIVEL + ANCHO, ALTO);
    this.cameras.main.startFollow(this.personaje, true, 1, 0);
    this.cameras.main.setFollowOffset(-ANCHO * 0.25, 0); // deja ver un poco más de lo que viene

    // --- Textos fijos en pantalla (no se mueven con la cámara) ---
    this.textoContador = this.add.text(20, 16, EMOJI_OBJETO + ' 0 / ' + OBJETOS_PARA_GANAR, { fontSize: '24px', color: '#ffffff' }).setScrollFactor(0);

    // --- Franja de controles, separada del área donde pasa el juego ---
    this.add.rectangle(0, ALTO_JUEGO, ANCHO, CONTROL_ALTO, 0x12101c, 0.9).setOrigin(0, 0).setScrollFactor(0);
    const boton = this.add.circle(ANCHO - 80, ALTO_JUEGO + CONTROL_ALTO / 2, 42, 0xffffff, 0.25).setScrollFactor(0).setStrokeStyle(3, 0xffffff).setInteractive();
    this.add.text(ANCHO - 80, ALTO_JUEGO + CONTROL_ALTO / 2, 'SALTAR', { fontSize: '14px', color: '#ffffff' }).setOrigin(0.5).setScrollFactor(0);
    boton.on('pointerdown', () => this.saltar());
    this.input.keyboard.on('keydown-SPACE', () => this.saltar());

    // --- Acceso directo a la invitación, sin jugar (accesibilidad) ---
    this.add.text(ANCHO - 10, 10, 'Ver invitación sin jugar →', { fontSize: '13px', color: '#cccccc' })
      .setOrigin(1, 0).setScrollFactor(0).setInteractive()
      .on('pointerdown', () => this.irALaInvitacion());
  }

  saltar() {
    if (this.gano) return;
    const tocandoPiso = this.personaje.body.blocked.down || this.personaje.body.touching.down;
    if (tocandoPiso) {
      this.personaje.body.setVelocityY(-520);
    }
  }

  recolectar(personaje, objeto) {
    objeto.destroy();
    this.contador++;
    this.textoContador.setText(EMOJI_OBJETO + ' ' + this.contador + ' / ' + OBJETOS_PARA_GANAR);
    if (this.contador >= OBJETOS_PARA_GANAR) {
      this.llegarAMeta(); // justo lo que pediste: con las 10, ya se llega a la meta
    }
  }

  tropezar() {
    // No termina la partida: el personaje se pone gris un instante,
    // para que se note el choque sin frustrar ni detener al invitado.
    if (this.tropezando) return;
    this.tropezando = true;
    this.cuerpo.setFillStyle(0x999999);
    this.time.delayedCall(250, () => {
      this.cuerpo.setFillStyle(0xff6b6b);
      this.tropezando = false;
    });
  }

  llegarAMeta() {
    if (this.gano) return;
    this.gano = true;
    this.personaje.body.setVelocity(0, 0);
    this.cameras.main.flash(400, 255, 255, 255);

    // El festejo se muestra siempre en el centro de la pantalla, sin
    // importar si ganaste juntando las 10 o llegando físicamente al
    // cartel del final (así nunca te lo perdés).
    const simbolo = this.add.text(this.scale.width / 2, this.scale.height / 2, SIMBOLO_FINAL, { fontSize: '72px' })
      .setOrigin(0.5).setScrollFactor(0).setScale(0.3);
    this.tweens.add({ targets: simbolo, scale: 1.2, duration: 400, ease: 'Back.Out' });

    this.time.delayedCall(700, () => this.irALaInvitacion());
  }

  irALaInvitacion() {
    this.scene.start('EscenaInvitacion');
  }

  update() {
    if (this.gano) return;
    // El personaje avanza solo; el jugador únicamente controla el salto.
    // (Ya no hay una "pared" invisible al final: si no llega a juntar las
    // 10, simplemente sigue corriendo en vez de frenarse en seco.)
    this.personaje.body.setVelocityX(VELOCIDAD_SCROLL);
  }
}

// ======================================================
// ESCENA 2: LA INVITACIÓN
// ======================================================
class EscenaInvitacion extends Phaser.Scene {
  constructor() { super('EscenaInvitacion'); }

  create() {
    const ANCHO = this.scale.width;
    const ALTO = this.scale.height;

    // Los datos del evento ocupan solo la parte de arriba de la pantalla;
    // la parte de abajo queda libre para la tarjeta de RSVP (HTML), que
    // se muestra por encima de esto.
    this.add.rectangle(0, 0, ANCHO, ALTO, 0x1a1a2e).setOrigin(0, 0);
    this.add.text(ANCHO / 2, ALTO * 0.08, '¡Festejemos juntos!', { fontSize: '22px', color: '#ffd93d' }).setOrigin(0.5);
    this.add.text(ANCHO / 2, ALTO * 0.08 + 38, INVITACION.nombres, { fontSize: '28px', color: '#ffffff', fontStyle: 'bold' }).setOrigin(0.5);
    this.add.text(ANCHO / 2, ALTO * 0.08 + 72, INVITACION.tipoEvento, { fontSize: '14px', color: '#cccccc' }).setOrigin(0.5);

    const datos = [
      '📅 ' + INVITACION.fecha + ' — ' + INVITACION.hora,
      '📍 ' + INVITACION.lugar,
      INVITACION.direccion,
    ];
    datos.forEach((linea, i) => {
      this.add.text(ANCHO / 2, ALTO * 0.08 + 112 + i * 22, linea, { fontSize: '13px', color: '#ffffff' }).setOrigin(0.5);
    });

    // Mostramos la tarjeta de RSVP (HTML) y conectamos el link para
    // volver a jugar, que también vive ahí afuera del canvas.
    mostrarUIInvitacion();
    document.getElementById('volver-jugar').onclick = () => {
      ocultarUIInvitacion();
      this.scene.start('EscenaJuego');
    };
  }
}

// ======================================================
// CONFIGURACIÓN DEL MOTOR (Phaser)
// ======================================================
new Phaser.Game({
  type: Phaser.AUTO,
  width: window.innerWidth,
  height: window.innerHeight,
  backgroundColor: '#87ceeb',
  parent: 'game-container',
  scale: {
    mode: Phaser.Scale.RESIZE,
    autoCenter: Phaser.Scale.CENTER_BOTH,
  },
  physics: {
    default: 'arcade',
    arcade: { gravity: { y: 1200 }, debug: false },
  },
  scene: [EscenaJuego, EscenaInvitacion],
});
</script>
</body>
</html>

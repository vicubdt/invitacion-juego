// con guión bajo (tipo_evento); el resto del código usa camelCase

function normalizarInvitacion(fila) {
  return {
    nombres: fila.nombres,

    fecha: fila.fecha,
    hora: fila.hora,

}

async function cargarInvitacion(id) {
  // 1) Buscarla en la base de datos real (Supabase) — esta es la fuente
  //    de verdad: acá es donde van a vivir las invitaciones de verdad.
  try {
    const { data, error } = await clienteDB
      .from('invitaciones')
      .select('*')
      .eq('id', id)
      .maybeSingle();
    if (data) {
      const invitacion = normalizarInvitacion(data);
      // La guardamos también en el celu, por si el día de mañana se corta
      // la conexión justo cuando alguien recarga la página a mitad de partida.
      localStorage.setItem('invitacion_' + id, JSON.stringify(invitacion));
      return invitacion;
    }
  } catch (error) {
    console.error('No se pudo consultar Supabase, probamos con lo guardado en el celu:', error);
  }
  // 2) Si no se pudo traer de la base (sin internet, Supabase caído, etc.),
  //    ¿la teníamos guardada de una visita anterior en este mismo celu?
  const guardada = localStorage.getItem('invitacion_' + id);
  if (guardada) return JSON.parse(guardada);
  // 3) Catálogo de ejemplo embebido en el código, como último respaldo,
  //    para que la demo nunca se rompa aunque falle todo lo demás.
  if (CATALOGO_DEMO[id]) return CATALOGO_DEMO[id];
  return CATALOGO_DEMO.demo;
}

// ======================================================
// MÚSICA DE FONDO
//
// En vez de usar un archivo de música grabado (que traería problemas de
// derechos de autor si no es nuestro), generamos un sonido 8-bit/chiptune
// con código, estilo "jueguito retro". Es 100% original: no hay ningún
// riesgo de copyright, y no hace falta subir ni alojar ningún archivo de
// audio en ningún lado.
//
// Los navegadores no dejan arrancar sonido sin que la persona toque algo
// primero, así que esto se crea recién cuando el invitado elige "con
// sonido" en la pantalla inicial (ver "pedirPreferenciaSonido" más abajo).
// ======================================================
let SONIDO_ACTIVADO = false;
let musicaJuego = null;

function crearMusicaJuego() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const salida = ctx.createGain();
  salida.gain.value = 0.12; // volumen bajo, de fondo
  salida.connect(ctx.destination);

  const NOTA = { DO: 261.63, RE: 293.66, MI: 329.63, FA: 349.23, SOL: 392.00, LA: 440.00, SI: 493.88, DO2: 523.25 };
  // Melodía cortita y alegre que se repite en loop.
  const MELODIA = [
    [NOTA.DO, 0.15], [NOTA.MI, 0.15], [NOTA.SOL, 0.15], [NOTA.DO2, 0.15],
    [NOTA.SOL, 0.15], [NOTA.MI, 0.15], [NOTA.DO, 0.3],
    [NOTA.RE, 0.15], [NOTA.FA, 0.15], [NOTA.LA, 0.15], [NOTA.FA, 0.15],
    [NOTA.RE, 0.3], [0, 0.15],
  ];

  let activo = false;
  let temporizador = null;

  function tocarNota(frecuencia, duracion) {
    if (!frecuencia) return; // 0 = silencio (un "pulso" sin sonido, para el ritmo)
    const osc = ctx.createOscillator();
    const volumenNota = ctx.createGain();
    osc.type = 'square'; // onda cuadrada = sonido "8 bits"
    osc.frequency.value = frecuencia;
    volumenNota.gain.setValueAtTime(0.9, ctx.currentTime);
    volumenNota.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duracion);
    osc.connect(volumenNota);
    volumenNota.connect(salida);
    osc.start();
    osc.stop(ctx.currentTime + duracion);
  }

  function loop(i) {
    if (!activo) return;
    const [frecuencia, duracion] = MELODIA[i % MELODIA.length];
    tocarNota(frecuencia, duracion * 0.9);
    temporizador = setTimeout(() => loop(i + 1), duracion * 1000);
  }

  return {
    iniciar() {
      if (activo) return;
      activo = true;
      if (ctx.state === 'suspended') ctx.resume();
      loop(0);
    },
    detener() {
      activo = false;
      clearTimeout(temporizador);
    },
  };
}

// ======================================================
// RSVP (confirmación de asistencia)
//
// La respuesta se guarda en dos lugares a la vez:
// 1) En el celu de quien responde (localStorage), para que si vuelve a
//    entrar al mismo link, vea su propia respuesta y pueda editarla.
// 2) En Supabase (la base de datos), para que vos puedas ver TODAS las
//    respuestas juntas desde el panel de Supabase, sin depender del
//    celu de cada invitado.
// ======================================================
function claveRSVP(id) { return 'rsvp_' + id; }

function obtenerRSVPGuardado(id) {
  const guardado = localStorage.getItem(claveRSVP(id));
  return guardado ? JSON.parse(guardado) : null;
}

async function guardarRSVP(id, datos) {
  // Guardamos primero en el celu: esto nunca falla y es lo que le
  // permite al invitado ver/editar su respuesta aunque no haya señal.
  localStorage.setItem(claveRSVP(id), JSON.stringify(datos));

  // Después intentamos mandarla a la base de datos central. Si falla
  // (por ejemplo, sin internet), no rompemos la experiencia del
  // invitado: el envío va a quedar pendiente para la próxima vez que
  // use el formulario, y mientras tanto ya ve su respuesta guardada.
  try {
    await clienteDB.from('respuestas_rsvp').insert({
      invitacion_id: id,
      nombre: datos.nombre,
      asiste: datos.asiste,
      cantidad: datos.cantidad,
      mensaje: datos.mensaje,
    });
  } catch (error) {
    console.error('No se pudo guardar la respuesta en Supabase:', error);
  }
}

      <input id="rsvp-nombre" placeholder="Tu nombre" style="width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:none;margin-bottom:8px;font-size:15px;font-family:sans-serif;">

        <button data-asiste="no" class="rsvp-opcion" style="flex:1;padding:10px;border-radius:8px;border:2px solid #ff6b6b;background:none;color:#fff;font-size:14px;">No puedo</button>
      </div>
      <div id="rsvp-cantidad-cont" style="display:none;margin-bottom:8px;">
        <label style="font-size:13px;color:#ccc;">¿Cuántos van (contándote)?</label>
        <input id="rsvp-cantidad" type="number" min="1" max="10" value="1" style="width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:none;margin-top:4px;font-size:15px;">
      </div>
      <textarea id="rsvp-mensaje" placeholder="Mensaje (opcional)" rows="2" style="width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:none;margin-bottom:10px;font-size:14px;font-family:sans-serif;"></textarea>
      <button id="rsvp-enviar" disabled style="width:100%;padding:12px;border-radius:8px;border:none;background:#666;color:#fff;font-size:15px;font-weight:bold;">Confirmar</button>
      <p id="rsvp-error" style="color:#ff8787;font-size:13px;margin:6px 0 0;"></p>
    `;

    let asisteElegido = null;
    const botones = cont.querySelectorAll('.rsvp-opcion');
    const nombreInput = document.getElementById('rsvp-nombre');
    const btnEnviar = document.getElementById('rsvp-enviar');

    function actualizarBotonEnviar() {
      const ok = nombreInput.value.trim().length > 0 && asisteElegido !== null;
      btnEnviar.disabled = !ok;
      btnEnviar.style.background = ok ? '#ffd93d' : '#666';
      btnEnviar.style.color = ok ? '#1a1a2e' : '#fff';
    }

    botones.forEach(b => b.onclick = () => {
      asisteElegido = b.dataset.asiste === 'si';
      botones.forEach(x => x.style.opacity = '0.4');
      b.style.opacity = '1';
      document.getElementById('rsvp-cantidad-cont').style.display = asisteElegido ? 'block' : 'none';
      actualizarBotonEnviar();
    });
    nombreInput.oninput = actualizarBotonEnviar;

    btnEnviar.onclick = async () => {
      const nombre = nombreInput.value.trim();
      if (!nombre || asisteElegido === null) {
        document.getElementById('rsvp-error').textContent = 'Completá tu nombre y si vas a venir.';
        return;
      }
      const cantidadInput = parseInt(document.getElementById('rsvp-cantidad').value, 10) || 1;
      const cantidad = asisteElegido ? Math.max(1, Math.min(10, cantidadInput)) : 0;
      const mensaje = document.getElementById('rsvp-mensaje').value.trim();
      btnEnviar.disabled = true;
      btnEnviar.textContent = 'Enviando...';
      await guardarRSVP(ID_INVITACION, { nombre, asiste: asisteElegido, cantidad, mensaje, fecha: new Date().toISOString() });
      renderFormularioRSVP();
    };
  }
}

// INFORMACIÓN EXTRA DE LA INVITACIÓN (cuenta regresiva, cómo llegar,
// agendar, compartir, dress code, regalo/transferencia y el QR)
// ======================================================
let intervaloCuentaRegresiva = null;

function linkMaps(direccion) {
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(direccion || '');
}

function linkCalendario(invitacion) {
  if (!invitacion.fechaHoraIso) return null;
  const inicio = new Date(invitacion.fechaHoraIso);
  if (isNaN(inicio.getTime())) return null;
  const DURACION_HORAS_DEFAULT = 3; // si no sabemos cuánto dura el evento, asumimos 3hs
  const fin = new Date(inicio.getTime() + DURACION_HORAS_DEFAULT * 60 * 60 * 1000);
  const comoUTC = (d) => d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: invitacion.nombres + ' — ' + invitacion.tipoEvento,
    dates: comoUTC(inicio) + '/' + comoUTC(fin),
    location: invitacion.direccion || invitacion.lugar || '',
    details: 'Invitación: ' + window.location.href,
  });
  return 'https://www.google.com/calendar/render?' + params.toString();
}

function formatearCuentaRegresiva(fechaHoraIso) {
  const objetivo = new Date(fechaHoraIso).getTime();
  if (isNaN(objetivo)) return null;
  const diferencia = objetivo - Date.now();
  if (diferencia <= 0) return '¡Ya llegó el día! 🎉';
  const dias = Math.floor(diferencia / 86400000);
  const horas = Math.floor((diferencia % 86400000) / 3600000);
  const minutos = Math.floor((diferencia % 3600000) / 60000);
  const segundos = Math.floor((diferencia % 60000) / 1000);
  return dias + 'd ' + horas + 'h ' + minutos + 'm ' + segundos + 's';
}

function actualizarCuentaRegresiva() {
  const el = document.getElementById('cuenta-regresiva');
  if (!el) return;
  el.textContent = '⏳ ' + formatearCuentaRegresiva(INVITACION.fechaHoraIso);
}

async function generarQRDataURL(texto) {
  try {
    return await QRCode.toDataURL(texto, { width: 240, margin: 1, color: { dark: '#1a1a2e', light: '#ffffff' } });
  } catch (error) {
    console.error('No se pudo generar el código QR:', error);
    return null;
  }
}

  const mensajeWsp = encodeURIComponent('¡Te invito a mi evento! Mirá la invitación: ' + urlInvitacion);
  html += '<a href="https://wa.me/?text=' + mensajeWsp + '" target="_blank" rel="noopener" style="flex:1;min-width:110px;text-align:center;padding:10px;border-radius:8px;border:1px solid #51cf66;color:#51cf66;text-decoration:none;font-size:13px;">💬 Compartir</a>';

  if (INVITACION.dressCode) {
    html += '<p style="margin:0 0 10px;font-size:13px;"><strong>Dress code:</strong> ' + INVITACION.dressCode + '</p>';

    if (INVITACION.regaloTexto) html += '<p style="margin:0 0 8px;font-size:13px;">' + INVITACION.regaloTexto + '</p>';
    if (INVITACION.regaloDatos) {

        + '<code id="regalo-datos-texto" style="flex:1;font-size:13px;background:#12101c;padding:6px 8px;border-radius:6px;word-break:break-all;">' + INVITACION.regaloDatos + '</code>'

  }

  html += '<div style="text-align:center;margin-bottom:14px;">'
    + '<p style="font-size:12px;color:#ccc;margin:0 0 8px;">Código QR de esta invitación</p>'
    + '<div id="qr-contenedor"></div>'
    + '<a id="qr-descargar" download="invitacion-' + ID_INVITACION + '.png" style="display:none;font-size:12px;color:#ffd93d;">Descargar QR</a>'
    + '</div>';

  html += '<hr style="border:none;border-top:1px solid #333;margin:0 0 14px;">';

  cont.innerHTML = html;

  const btnCopiar = document.getElementById('regalo-copiar');
  if (btnCopiar) {
    btnCopiar.onclick = async () => {
      try {
        await navigator.clipboard.writeText(INVITACION.regaloDatos);
        btnCopiar.textContent = '¡Copiado!';
        setTimeout(() => { btnCopiar.textContent = 'Copiar'; }, 1500);
      } catch (error) {
        console.error('No se pudo copiar:', error);
      }
    };
  }

  if (INVITACION.fechaHoraIso) {
    actualizarCuentaRegresiva();
    intervaloCuentaRegresiva = setInterval(actualizarCuentaRegresiva, 1000);
  }

  const qrDataUrl = await generarQRDataURL(urlInvitacion);
  if (qrDataUrl) {
    document.getElementById('qr-contenedor').innerHTML = '<img src="' + qrDataUrl + '" alt="Código QR" style="width:160px;height:160px;border-radius:8px;">';
    const enlaceQR = document.getElementById('qr-descargar');
    enlaceQR.href = qrDataUrl;
    enlaceQR.style.display = 'inline-block';
  }
}

async function mostrarUIInvitacion() {
  document.getElementById('rsvp-card').style.display = 'block';
  // El link para "jugar de nuevo" solo tiene sentido si esta invitación
  // incluye el juego — en la que es solo tarjeta, no hay nada a lo que volver.
  document.getElementById('volver-jugar').style.display = INVITACION.incluyeJuego ? 'block' : 'none';
  await construirTarjetaInvitacion();
  renderFormularioRSVP();
}

function ocultarUIInvitacion() {
  document.getElementById('rsvp-card').style.display = 'none';
  document.getElementById('volver-jugar').style.display = 'none';
  if (intervaloCuentaRegresiva) {
    clearInterval(intervaloCuentaRegresiva);
    intervaloCuentaRegresiva = null;
  }
}

const VELOCIDAD_SCROLL = 220;          // píxeles por segundo
const OBJETOS_PARA_GANAR = 10;         // con juntar esta cantidad, se termina el nivel
const OBJETOS_TOTALES = 15;            // hay más de los necesarios: si te perdés alguno, quedan otros para seguir juntando
const ESPACIADO_MIN = 260;             // distancia mínima entre frutillas
const ESPACIADO_MAX = 340;             // distancia máxima entre frutillas

// ======================================================
// ESCENA 1: EL JUEGO
// ======================================================
class EscenaJuego extends Phaser.Scene {
  constructor() { super('EscenaJuego'); }

  preload() {
    // PRUEBA: por ahora el personaje es una imagen fija (la que generamos
    // con IA de prueba, cuerpo completo y quieto). Es una imagen ESTÁTICA:
    // no tiene partes animadas, solo se mueve entera (avanza y salta), como
    // el resto del personaje en cualquier juego simple de este estilo.
    // Más adelante esto va a venir de la invitación de cada cliente (una
    // imagen distinta por invitación, con el estilo que haya elegido:
    // doodle, retro o pixel art), no de un archivo fijo como este.
    this.load.image('personaje', 'personaje-cabeza.png');
  }

  create() {
    this.gano = false;
    this.tropezando = false;

    // El tamaño real de la pantalla del dispositivo (celu o compu),
    // así el juego ocupa toda la pantalla y no un recuadro chiquito.
    const ANCHO = this.scale.width;
    const ALTO = this.scale.height;
    this.ANCHO = ANCHO;

    // Reservamos una franja abajo solo para los controles, separada del
    // área donde pasan los obstáculos y las frutillas (para que el botón
    // de saltar no quede "pisando" el juego, como pasaba antes).
    const CONTROL_ALTO = 110;
    const ALTO_JUEGO = ALTO - CONTROL_ALTO;

    // --- Personaje: una sola imagen fija que se mueve entera ---
    // Nada de piezas por separado ni animación de piernas: es un solo
    // dibujo (generado por IA a partir de la foto) que avanza solo y
    // salta. Más simple, más prolijo, y es justo lo que pidió Vicki.
    this.personaje = this.add.container(120, ALTO_JUEGO - 100);

    const ALTO_PERSONAJE = 86; // alto del dibujo completo (cabeza a pies)
    const ANCHO_PERSONAJE = Math.round(ALTO_PERSONAJE * 0.45); // proporción de una persona de pie

    this.torso = this.add.image(0, 0, 'personaje')
      .setDisplaySize(ANCHO_PERSONAJE, ALTO_PERSONAJE).setOrigin(0.5, 1); // origen abajo = apoya en el piso

    this.personaje.add([this.torso]);

    this.physics.add.existing(this.personaje);
    this.personaje.body.setSize(ANCHO_PERSONAJE, ALTO_PERSONAJE);
    // El origen de la imagen está abajo (apoyado en el piso), así que la
    // caja de colisión tiene que correrse hacia arriba para cubrir todo
    // el dibujo, no solo la mitad de abajo.
    this.personaje.body.setOffset(0, -ALTO_PERSONAJE);
    this.personaje.body.setCollideWorldBounds(false);

    // --- Objetos coleccionables (frutillas de prueba) ---
    // Generamos más frutillas de las que hacen falta (15, cuando solo se
    // necesitan 10): si se pierde alguna, el recorrido sigue dando más
    // oportunidades, en vez de terminar antes de juntar las 10.
    this.objetos = this.physics.add.staticGroup();
    this.contador = 0;
    let x = 400;
    for (let i = 0; i < OBJETOS_TOTALES; i++) {
      const y = ALTO_JUEGO - Phaser.Math.Between(90, 160);
      const objeto = this.add.circle(x, y, 12, COLOR_OBJETO).setStrokeStyle(2, 0xc9a200);
      this.physics.add.existing(objeto, true);
      this.objetos.add(objeto);
      x += Phaser.Math.Between(ESPACIADO_MIN, ESPACIADO_MAX);
    }
    this.physics.add.overlap(this.personaje, this.objetos, this.recolectar, null, this);
    const DISTANCIA_NIVEL = x + 800; // bastante pista de sobra después de la última frutilla
    this.distanciaNivel = DISTANCIA_NIVEL;

    // --- Piso (ya con el largo del nivel calculado) ---
    this.piso = this.add.rectangle(0, ALTO_JUEGO - 40, DISTANCIA_NIVEL + ANCHO * 2, 20, 0x4a3f6b).setOrigin(0, 0);
    this.physics.add.existing(this.piso, true); // true = estático
    this.physics.add.collider(this.personaje, this.piso);

    // --- Obstáculos: NO terminan la partida, solo hacen tropezar ---
    this.obstaculos = this.physics.add.staticGroup();
    for (let ox = 600; ox < DISTANCIA_NIVEL - 250; ox += Phaser.Math.Between(300, 420)) {
      const obstaculo = this.add.rectangle(ox, ALTO_JUEGO - 64, 30, 48, 0x6c5ce7).setStrokeStyle(2, 0x1a1a2e);
      this.physics.add.existing(obstaculo, true);
      this.obstaculos.add(obstaculo);
    }
    this.physics.add.overlap(this.personaje, this.obstaculos, this.tropezar, null, this);

    // --- Meta visual al final del todo: es una red de seguridad, no el
    //     disparador principal (ese es juntar las 10 frutillas) ---
    this.meta = this.add.rectangle(DISTANCIA_NIVEL, ALTO_JUEGO - 120, 50, 160, 0x51cf66, 0.3).setStrokeStyle(3, 0x2f9e44);
    this.add.text(DISTANCIA_NIVEL, ALTO_JUEGO - 220, SIMBOLO_FINAL, { fontSize: '48px' }).setOrigin(0.5);
    this.physics.add.existing(this.meta, true);
    this.physics.add.overlap(this.personaje, this.meta, this.llegarAMeta, null, this);

    // --- Cámara que sigue al personaje ---
    this.cameras.main.setBounds(0, 0, DISTANCIA_NIVEL + ANCHO, ALTO);
    this.physics.world.setBounds(0, 0, DISTANCIA_NIVEL + ANCHO, ALTO);
    this.cameras.main.startFollow(this.personaje, true, 1, 0);
    this.cameras.main.setFollowOffset(-ANCHO * 0.25, 0); // deja ver un poco más de lo que viene

    // --- Textos fijos en pantalla (no se mueven con la cámara) ---
    this.textoContador = this.add.text(20, 16, EMOJI_OBJETO + ' 0 / ' + OBJETOS_PARA_GANAR, { fontSize: '24px', color: '#ffffff' }).setScrollFactor(0);

    // --- Franja de controles, separada del área donde pasa el juego ---
    this.add.rectangle(0, ALTO_JUEGO, ANCHO, CONTROL_ALTO, 0x12101c, 0.9).setOrigin(0, 0).setScrollFactor(0);
    const boton = this.add.circle(ANCHO - 80, ALTO_JUEGO + CONTROL_ALTO / 2, 42, 0xffffff, 0.25).setScrollFactor(0).setStrokeStyle(3, 0xffffff).setInteractive();
    this.add.text(ANCHO - 80, ALTO_JUEGO + CONTROL_ALTO / 2, 'SALTAR', { fontSize: '14px', color: '#ffffff' }).setOrigin(0.5).setScrollFactor(0);
    boton.on('pointerdown', () => this.saltar());
    this.input.keyboard.on('keydown-SPACE', () => this.saltar());

    // --- Acceso directo a la invitación, sin jugar (accesibilidad) ---
    this.add.text(ANCHO - 10, 10, 'Ver invitación sin jugar →', { fontSize: '13px', color: '#cccccc' })
      .setOrigin(1, 0).setScrollFactor(0).setInteractive()
      .on('pointerdown', () => this.irALaInvitacion());

    // --- Música de fondo, solo si el invitado eligió jugar con sonido ---
    if (SONIDO_ACTIVADO && musicaJuego) {
      musicaJuego.iniciar();
    }
  }

  saltar() {
    if (this.gano) return;
    const tocandoPiso = this.personaje.body.blocked.down || this.personaje.body.touching.down;
    if (tocandoPiso) {
      this.personaje.body.setVelocityY(-520);
    }
  }

  recolectar(personaje, objeto) {
    objeto.destroy();
    this.contador++;
    this.textoContador.setText(EMOJI_OBJETO + ' ' + this.contador + ' / ' + OBJETOS_PARA_GANAR);
    if (this.contador >= OBJETOS_PARA_GANAR) {
      this.llegarAMeta(); // justo lo que pediste: con las 10, ya se llega a la meta
    }
  }

  tropezar() {
    // No termina la partida: el personaje se pone gris un instante,
    // para que se note el choque sin frustrar ni detener al invitado.
    if (this.tropezando) return;
    this.tropezando = true;
    this.torso.setTint(0x999999);
    this.time.delayedCall(250, () => {
      this.torso.clearTint();
      this.tropezando = false;
    });
  }

  llegarAMeta() {
    if (this.gano) return;
    this.gano = true;
    this.personaje.body.setVelocity(0, 0);
    this.cameras.main.flash(400, 255, 255, 255);

    // El festejo se muestra siempre en el centro de la pantalla, sin
    // importar si ganaste juntando las 10 o llegando físicamente al
    // cartel del final (así nunca te lo perdés).
    const simbolo = this.add.text(this.scale.width / 2, this.scale.height / 2, SIMBOLO_FINAL, { fontSize: '72px' })
      .setOrigin(0.5).setScrollFactor(0).setScale(0.3);
    this.tweens.add({ targets: simbolo, scale: 1.2, duration: 400, ease: 'Back.Out' });

    this.time.delayedCall(700, () => this.irALaInvitacion());
  }

  irALaInvitacion() {
    if (musicaJuego) musicaJuego.detener();
    this.scene.start('EscenaInvitacion');
  }

  update() {
    if (this.gano) return;
    // El personaje avanza solo; el jugador únicamente controla el salto.
    // (Ya no hay una "pared" invisible al final: si no llega a juntar las
    // 10, simplemente sigue corriendo en vez de frenarse en seco.)
    this.personaje.body.setVelocityX(VELOCIDAD_SCROLL);
  }
}

// ======================================================
// ESCENA 2: LA INVITACIÓN
// ======================================================
class EscenaInvitacion extends Phaser.Scene {
  constructor() { super('EscenaInvitacion'); }

  create() {
    const ANCHO = this.scale.width;
    const ALTO = this.scale.height;

    // Los datos del evento ocupan solo la parte de arriba de la pantalla;
    // la parte de abajo queda libre para la tarjeta de RSVP (HTML), que
    // se muestra por encima de esto.
    this.add.rectangle(0, 0, ANCHO, ALTO, 0x1a1a2e).setOrigin(0, 0);
    this.add.text(ANCHO / 2, ALTO * 0.08, '¡Festejemos juntos!', { fontSize: '22px', color: '#ffd93d' }).setOrigin(0.5);
    this.add.text(ANCHO / 2, ALTO * 0.08 + 38, INVITACION.nombres, { fontSize: '28px', color: '#ffffff', fontStyle: 'bold' }).setOrigin(0.5);
    this.add.text(ANCHO / 2, ALTO * 0.08 + 72, INVITACION.tipoEvento, { fontSize: '14px', color: '#cccccc' }).setOrigin(0.5);

    const datos = [
      '📅 ' + INVITACION.fecha + ' — ' + INVITACION.hora,
      '📍 ' + INVITACION.lugar,
      INVITACION.direccion,
    ];
    datos.forEach((linea, i) => {
      this.add.text(ANCHO / 2, ALTO * 0.08 + 112 + i * 22, linea, { fontSize: '13px', color: '#ffffff' }).setOrigin(0.5);
    });

    // Mostramos la tarjeta de RSVP (HTML) y, si esta invitación incluye
    // juego, conectamos el link para volver a jugar.
    mostrarUIInvitacion();
    if (INVITACION.incluyeJuego) {
      document.getElementById('volver-jugar').onclick = () => {
        ocultarUIInvitacion();
        this.scene.start('EscenaJuego');
      };
    }
  }
}

// ======================================================
// ARRANQUE: primero cargamos los datos de la invitación (ahora vienen de
// Supabase), y solo cuando ya los tenemos, arrancamos el motor del juego.
// Como esto implica esperar una respuesta de internet, mostramos un
// "Cargando..." breve mientras tanto en vez de una pantalla en blanco.
// ======================================================
async function iniciar() {
  const contenedor = document.getElementById('game-container');
  contenedor.innerHTML = '<div style="color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100%;font-size:16px;">Cargando...</div>';

  ID_INVITACION = obtenerIdDeLaUrl();
  INVITACION = await cargarInvitacion(ID_INVITACION);
  EMOJI_OBJETO = EMOJI_OBJETOS[INVITACION.objeto] || '🍓';
  COLOR_OBJETO = COLOR_OBJETOS[INVITACION.objeto] || 0xffd93d;
  SIMBOLO_FINAL = EMOJI_FINAL[INVITACION.tipoEvento] || '🎉';

  // La música solo existe durante el juego, así que si esta invitación no
  // lo incluye, ni siquiera preguntamos por el sonido — se va directo a
  // la tarjeta, con menos pasos de por medio para el invitado.
  if (INVITACION.incluyeJuego) {
    SONIDO_ACTIVADO = await pedirPreferenciaSonido();
  }

  contenedor.innerHTML = '';

  // Si no incluye juego, directamente no registramos esa escena: no hay
  // forma de llegar a ella ni por accidente.
  const escenas = INVITACION.incluyeJuego ? [EscenaJuego, EscenaInvitacion] : [EscenaInvitacion];

  new Phaser.Game({
    type: Phaser.AUTO,
    width: window.innerWidth,
    height: window.innerHeight,
    backgroundColor: '#87ceeb',
    parent: 'game-container',
    scale: {
      mode: Phaser.Scale.RESIZE,
      autoCenter: Phaser.Scale.CENTER_BOTH,
    },
    physics: {
      default: 'arcade',
      arcade: { gravity: { y: 1200 }, debug: false },
    },
    scene: escenas,
  });
}

iniciar();
</script>
